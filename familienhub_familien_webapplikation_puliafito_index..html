<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FamilienHub – Unser Familien-Cockpit</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- MSAL Browser für optionale Microsoft OneDrive / Graph API Synchronisation -->
  <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js" defer></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    /* Sanfte Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Animationen für den Kinder-Schlafmodus */
    @keyframes floatMoon {
      0%, 100% { transform: translateY(0px) rotate(-4deg); }
      50% { transform: translateY(-12px) rotate(4deg); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .animate-moon {
      animation: floatMoon 6s ease-in-out infinite;
    }
    .star {
      position: absolute;
      background: #fef08a;
      border-radius: 9999px;
      animation: twinkle var(--dur, 3s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    /* Toast Einblend-Animation */
    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .toast-enter {
      animation: slideUpFade 0.25s ease-out forwards;
    }

    /* Safe Area für moderne Smartphones */
    .pb-safe {
      padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-800">

  <!-- ===================================================================== -->
  <!-- HAUPT-APP-LAYOUT                                                      -->
  <!-- ===================================================================== -->
  <div id="app-shell" class="min-h-screen flex flex-col md:flex-row">

    <!-- DESKTOP / TABLET SIDEBAR -->
    <aside class="hidden md:flex md:flex-col md:w-64 lg:w-72 bg-white border-r border-slate-200/80 fixed inset-y-0 left-0 z-30 shadow-sm">
      <div class="p-6 flex items-center gap-3 border-b border-slate-100">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 text-white flex items-center justify-center shadow-md shadow-indigo-200">
          <i data-lucide="home" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-lg tracking-tight text-slate-900 leading-tight">FamilienHub</h1>
          <p class="text-xs text-slate-500 font-medium" id="sidebar-family-sub">Familie Meier</p>
        </div>
      </div>

      <nav id="desktop-nav" class="flex-1 p-4 space-y-1.5 overflow-y-auto">
        <!-- Wird dynamisch gerendert -->
      </nav>

      <!-- Sync & Sleep Quick Status in Sidebar -->
      <div class="p-4 border-t border-slate-100 space-y-2.5 bg-slate-50/70">
        <div id="sidebar-sleep-box" class="hidden">
          <!-- Wird für Eltern & Admin gerendert -->
        </div>
        <div class="flex items-center justify-between text-xs text-slate-500 px-2">
          <span class="flex items-center gap-1.5" id="sidebar-sync-status">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Lokal gespeichert
          </span>
          <span class="font-medium text-slate-400">v1.0</span>
        </div>
      </div>
    </aside>

    <!-- HAUPTBEREICH -->
    <div class="flex-1 flex flex-col md:pl-64 lg:pl-72 min-h-screen">

      <!-- TOP HEADER -->
      <header class="sticky top-0 z-20 bg-white/85 backdrop-blur-md border-b border-slate-200/80 px-4 sm:px-6 py-3">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-2">
          <!-- Links: Mobile Logo + Seitentitel -->
          <div class="flex items-center gap-2.5 min-w-0">
            <div class="md:hidden w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 text-white flex items-center justify-center shrink-0 shadow-sm">
              <i data-lucide="home" class="w-4 h-4"></i>
            </div>
            <div class="truncate">
              <h2 id="page-title" class="text-base sm:text-lg font-bold text-slate-900 truncate">Übersicht</h2>
              <p id="header-date" class="text-[11px] sm:text-xs text-slate-500 truncate"></p>
            </div>
          </div>

          <!-- Rechts: Status Badges & Rollenwechsel -->
          <div class="flex items-center gap-2 shrink-0">
            <!-- Sync Status Pill (kompakt) -->
            <button id="header-sync-btn" onclick="handleHeaderSyncClick()" title="Synchronisationsstatus"
              class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 hover:bg-slate-200/70 text-slate-600 transition">
              <span id="header-sync-dot" class="w-2 h-2 rounded-full bg-emerald-500"></span>
              <span id="header-sync-label">Lokal</span>
            </button>

            <!-- Schlafmodus Schnellbutton (nur Eltern & Admin) -->
            <button id="header-sleep-btn" onclick="openSleepQuickModal()" title="Kinder-Schlafmodus"
              class="hidden items-center gap-1.5 px-2.5 sm:px-3 py-2 rounded-xl text-xs font-semibold border transition min-h-[40px]">
              <i data-lucide="moon" class="w-4 h-4"></i>
              <span class="hidden sm:inline" id="header-sleep-label">Schlafmodus</span>
            </button>

  <!-- ===================================================================== -->

        <i data-lucide="moon-star" class="w-3.5 h-3.5"></i> Kinder-Ansicht geschützt

        <svg class="w-28 h-28 sm:w-36 sm:h-36 drop-shadow-[0_0_30px_rgba(253,224,71,0.35)]" viewBox="0 0 120 120" fill="none">
          <path d="M74 16C48.5 16 28 36.5 28 62C28 87.5 48.5 108 74 108C85.5 108 96 103.8 104 96.8C98.5 98.3 92.6 99 86.5 99C58.6 99 36 76.4 36 48.5C36 35.8 40.7 24.2 48.5 15.3C56.4 15.8 65 16 74 16Z" fill="#FEF08A"/>
          <circle cx="88" cy="34" r="3" fill="#FDE047" opacity="0.8"/>
          <circle cx="98" cy="52" r="2" fill="#FEF08A" opacity="0.7"/>
          <circle cx="76" cy="48" r="2.5" fill="#FDE047" opacity="0.6"/>
        </svg>
      </div>

      <div id="sleep-clock" class="text-6xl sm:text-7xl font-extrabold tracking-tight text-white mb-2 tabular-nums">20:00</div>
      <div id="sleep-date" class="text-indigo-200/80 text-sm sm:text-base font-medium mb-6">Donnerstag, 26. November</div>

      <h2 class="text-2xl sm:text-3xl font-bold text-amber-200 mb-2">Schlafmodus aktiv – Gute Nacht!</h2>
      <p class="text-indigo-200/90 text-sm sm:text-base mb-6">
        Es ist Schlafenszeit. Träum etwas Schönes!
      </p>

      <div class="inline-flex items-center gap-2.5 px-5 py-3 rounded-2xl bg-white/10 backdrop-blur-sm border border-white/15 text-sm font-medium text-indigo-100">
        <i data-lucide="sunrise" class="w-4 h-4 text-amber-300"></i>
        <span>Aufwachzeit: <strong id="sleep-wakeup-time" class="text-white">06:30 Uhr</strong></span>
      </div>
    </div>

    <!-- Unten: Entsperren nur per Eltern-/Admin-PIN -->
    <div class="relative z-10 mb-4">
      <button onclick="requestUnlockFromSleep()"
        class="inline-flex items-center gap-2 px-5 py-3 rounded-2xl bg-white/10 hover:bg-white/20 border border-white/15 text-indigo-100 text-sm font-semibold transition min-h-[48px]">
        <i data-lucide="lock" class="w-4 h-4"></i>
        Eltern / Admin entsperren
      </button>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- UNIVERSAL MODAL CONTAINER                                             -->
  <!-- ===================================================================== -->
  <div id="modal-backdrop" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div id="modal-panel" class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl shadow-2xl border border-slate-200/80 max-h-[90vh] flex flex-col overflow-hidden">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
        <h3 id="modal-title" class="text-lg font-bold text-slate-900">Dialog</h3>
        <button onclick="closeModal()" class="p-2 rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="modal-body" class="p-6 overflow-y-auto space-y-4">
        <!-- Inhalt dynamisch -->
      </div>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- TOAST BENACHRICHTIGUNGEN                                              -->
  <!-- ===================================================================== -->
  <div id="toast-container" class="fixed bottom-20 md:bottom-6 right-4 z-50 flex flex-col gap-2 max-w-sm w-[calc(100%-2rem)] pointer-events-none"></div>

  <!-- Versteckter File-Input für JSON Import -->
  <input type="file" id="json-import-input" accept=".json,application/json" class="hidden" onchange="handleJsonImport(event)">

  <!-- ===================================================================== -->

        { id: 't3', title: 'Bücher in der Bibliothek zurückbringen', memberId: 'm3', dueDate: getDateOffset(0), priority: 'hoch', done: false },
        { id: 't4', title: 'Altpapier bündeln für Sammlung', memberId: 'm2', dueDate: getDateOffset(3), priority: 'niedrig', done: true }
      ],
      shopping: {

        { id: 'a3', title: 'Zimmer aufräumen', memberId: 'm3', frequency: 'Mi & Sa', stars: 3, doneToday: false, icon: '🧸' },
        { id: 'a4', title: 'Altpapier & Kehricht rausbringen', memberId: 'm4', frequency: 'Dienstag', stars: 2, doneToday: false, icon: '♻️' },
        { id: 'a5', title: 'Pflanzen giessen', memberId: 'm3', frequency: 'Sonntag', stars: 1, doneToday: false, icon: '🪴' }
      ],
      helpers: {

          { day: 'Montag', lunch: 'Älplermagronen mit Apfelmus', dinner: 'Café complet (Brot, Käse, Aufschnitt)' },
          { day: 'Dienstag', lunch: 'Pouletgeschnetzeltes mit Reis & Rüebli', dinner: 'Kürbissuppe mit Knoblauchbrot' },
          { day: 'Mittwoch', lunch: 'Fischstäbli mit Kartoffelstock & Spinat', dinner: 'Flammkuchen selber belegen' },
          { day: 'Donnerstag', lunch: 'Spaghetti Bolognese & grüner Salat', dinner: 'Rösti mit Spiegelei' },
          { day: 'Freitag', lunch: 'Selbstgemachte Pizza', dinner: 'Birchermüesli & Früchte' },
          { day: 'Samstag', lunch: 'Bräteln im Wald / Cervelat', dinner: 'Raclette gemütlich' },

        ],
        notes: [
          { id: 'n1', text: 'Am Freitag braucht Noah Turnzeug & Hallenschuhe!', author: 'Mama', color: 'amber', date: getDateOffset(0) },

          { id: 'n3', text: 'Bitte Licht im Keller nach dem Wäscheholen löschen.', author: 'Mama', color: 'rose', date: getDateOffset(-1) }
        ],
        countdowns: [
          { id: 'cd1', title: 'Weihnachten', date: `${new Date().getFullYear()}-12-24`, emoji: '🎄' },

          { id: 'cd3', title: 'Skiferien Graubünden', date: getDateOffset(75), emoji: '⛷️' }
        ],
        contacts: [
          { id: 'ct1', name: 'Polizei Notruf', phone: '117', category: 'Notfall', urgent: true },
          { id: 'ct2', name: 'Feuerwehr Notruf', phone: '118', category: 'Notfall', urgent: true },
          { id: 'ct3', name: 'Sanität / Ambulanz', phone: '144', category: 'Notfall', urgent: true },
          { id: 'ct4', name: 'Tox Info Suisse (Vergiftung)', phone: '145', category: 'Notfall', urgent: true },
          { id: 'ct5', name: 'Kinderarztpraxis Dr. Weber', phone: '056 222 11 00', category: 'Arzt', urgent: false },
          { id: 'ct6', name: 'Primarschule Sekretariat', phone: '056 288 40 10', category: 'Schule', urgent: false },
          { id: 'ct7', name: 'Grosi & Grosspapi', phone: '079 412 34 56', category: 'Familie', urgent: false }
        ]
      },
      sync: {
        oneDriveClientId: '',
        oneDrivePath: '/FamilienHub/daten.json',
        autoSync: false,
        lastSync: null
      },
      push: {
        browserEnabled: false,
        ntfyTopic: '',
        notifyOnTask: true,
        notifyOnShopping: true,
        notifyOnEvent: true
      }
    };

    const SHOPPING_CATEGORIES = ['Früchte & Gemüse', 'Kühlregal', 'Vorrat', 'Haushalt', 'Sonstiges'];

    // =========================================================================
    // 2. APP STATE & PERSISTENZ
    // =========================================================================
    let state = loadState();
    let currentRole = localStorage.getItem('familienhub_role') || 'admin'; // 'admin' | 'parent' | 'child'
    let activeTab = 'dashboard';
    let calendarMode = 'own'; // 'own' | 'google'
    let calendarView = 'month'; // 'month' | 'agenda'
    let calendarCursor = new Date();
    let shoppingSubTab = 'list'; // 'list' | 'consumption'
    let taskFilterMember = 'all';
    let taskFilterStatus = 'all';
    let msalInstance = null;
    let oneDriveAccount = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(DEFAULT_STATE);
        const parsed = JSON.parse(raw);
        // Sanftes Mergen mit Defaults, falls neue Felder dazukommen
        return {
          ...structuredClone(DEFAULT_STATE),
          ...parsed,
          pins: { ...DEFAULT_STATE.pins, ...(parsed.pins || {}) },
          sleepMode: { ...DEFAULT_STATE.sleepMode, ...(parsed.sleepMode || {}) },
          calendar: { ...DEFAULT_STATE.calendar, ...(parsed.calendar || {}) },
          shopping: { ...DEFAULT_STATE.shopping, ...(parsed.shopping || {}) },
          helpers: { ...DEFAULT_STATE.helpers, ...(parsed.helpers || {}) },
          sync: { ...DEFAULT_STATE.sync, ...(parsed.sync || {}) },
          push: { ...DEFAULT_STATE.push, ...(parsed.push || {}) }
        };
      } catch (e) {
        console.error('Fehler beim Laden aus localStorage:', e);
        return structuredClone(DEFAULT_STATE);
      }
    }

    function saveState(triggerAutoSync = true) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        updateSyncBadge('local');
        if (triggerAutoSync && state.sync.autoSync && oneDriveAccount) {
          syncToOneDrive(true);
        }
      } catch (e) {
        console.error('Fehler beim Speichern:', e);
        showToast('Speicherfehler im Browser (Speicher voll?)', 'error');
      }
    }

    function canEdit() {
      return currentRole === 'admin' || currentRole === 'parent';
    }

    function isAdmin() {
      return currentRole === 'admin';
    }

    function uid(prefix = 'id') {
      return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    // =========================================================================
    // 3. HILFSFUNKTIONEN (Datum, Formatierung, Escape)
    // =========================================================================
    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDateCH(isoDate) {
      if (!isoDate) return '';
      const parts = isoDate.split('-');
      if (parts.length !== 3) return isoDate;
      return `${parts[2]}.${parts[1]}.${parts[0]}`;
    }

    function daysBetween(dateStrA, dateStrB) {
      const a = new Date(dateStrA + 'T00:00:00');
      const b = new Date(dateStrB + 'T00:00:00');
      return Math.round((b - a) / (1000 * 60 * 60 * 24));
    }

    function todayISO() {
      return new Date().toISOString().split('T')[0];
    }

    function getMember(id) {
      if (id === 'all') return { id: 'all', name: 'Alle', short: 'Alle', color: '#6366f1', avatar: '👨‍👩‍👧‍👦' };
      return state.members.find(m => m.id === id) || { id: '?', name: 'Unbekannt', short: '?', color: '#94a3b8', avatar: '👤' };
    }

    function getConsumptionStatus(item) {
      const elapsed = Math.max(0, daysBetween(item.lastBought, todayISO()));
      const remaining = item.intervalDays - elapsed;
      const pct = Math.min(100, Math.round((elapsed / Math.max(1, item.intervalDays)) * 100));
      let status = 'ok';
      if (remaining <= 0) status = 'due';
      else if (remaining <= 1 || pct >= 80) status = 'soon';
      return { elapsed, remaining, pct, status };
    }

      };
      const icons = {

        success: 'check-circle-2',
        warning: 'alert-triangle',

      };
      const el = document.createElement('div');
      el.className = `toast-enter pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-lg border text-sm font-medium ${colors[type] || colors.info}`;
      el.innerHTML = `<i data-lucide="${icons[type] || 'info'}" class="w-4 h-4 shrink-0"></i><span class="flex-1">${esc(message)}</span>`;
      container.appendChild(el);

        el.style.transform = 'translateY(8px)';

    function updatePinDots() {
      const container = document.getElementById('pin-dots');
      if (!container) return;
      Array.from(container.children).forEach((dot, idx) => {
        if (idx < pinBuffer.length) {
          dot.className = 'w-4 h-4 rounded-full border-2 border-indigo-600 bg-indigo-600 scale-110 transition-all';
        } else {
          dot.className = 'w-4 h-4 rounded-full border-2 border-slate-300 bg-white transition-all';

    function pressPinKey(digit) {
      if (pinBuffer.length >= 4) return;
      pinBuffer += digit;
      document.getElementById('pin-error').textContent = '';
      updatePinDots();

      if (pinBuffer.length === 4) {
        setTimeout(() => {
          let valid = false;
          let matchedRole = pinTargetRole;
          if (pinTargetRole === 'admin' && pinBuffer === state.pins.admin) valid = true;
          else if (pinTargetRole === 'parent' && (pinBuffer === state.pins.parent || pinBuffer === state.pins.admin)) valid = true;
          else if (pinTargetRole === 'any_adult') {
            if (pinBuffer === state.pins.admin) { valid = true; matchedRole = 'admin'; }
            else if (pinBuffer === state.pins.parent) { valid = true; matchedRole = 'parent'; }
          }

          if (valid) {
            const cb = pinSuccessCallback;
            pinSuccessCallback = null;
            if (cb) cb(matchedRole);
          } else {
            pinBuffer = '';
            updatePinDots();
            const err = document.getElementById('pin-error');
            if (err) err.textContent = 'Falscher PIN. Bitte nochmals versuchen.';
          }
        }, 120);
      }
    }

    function isWithinSleepWindow() {
      if (!state.sleepMode.enabled) return false;
      const now = new Date();
      const curMins = now.getHours() * 60 + now.getMinutes();
      const [sh, sm] = state.sleepMode.startTime.split(':').map(Number);
      const [eh, em] = state.sleepMode.endTime.split(':').map(Number);
      const startMins = sh * 60 + sm;
      const endMins = eh * 60 + em;

      if (startMins <= endMins) {
        return curMins >= startMins && curMins < endMins;
      } else {
        // Über Mitternacht (z.B. 19:30 bis 06:30)
        return curMins >= startMins || curMins < endMins;
      }
    }

    function isSleepCurrentlyActive() {
      return state.sleepMode.manualActive || isWithinSleepWindow();
    }

      const container = document.getElementById('sleep-stars-container');
      if (!container || container.children.length > 0) return;
      for (let i = 0; i < 45; i++) {

        star.className = 'star';
        const size = Math.random() * 3 + 1.5;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.left = `${Math.random() * 100}%`;
        star.style.top = `${Math.random() * 85}%`;
        star.style.setProperty('--dur', `${2.5 + Math.random() * 3.5}s`);
        star.style.setProperty('--delay', `${Math.random() * 4}s`);
        container.appendChild(star);
      }
    }

    // =========================================================================
    // 7. PUSH-BENACHRICHTIGUNGEN (Browser Notification API + ntfy.sh)
    // =========================================================================
    async function requestBrowserPushPermission() {
      if (!('Notification' in window)) {
        showToast('Dieser Browser unterstützt keine Push-Benachrichtigungen.', 'warning');
        return;
      }
      try {
        const perm = await Notification.requestPermission();
        if (perm === 'granted') {
          state.push.browserEnabled = true;
          saveState();
          showToast('Browser-Benachrichtigungen aktiviert!', 'success');
          sendPushNotification('FamilienHub verbunden', 'Push-Benachrichtigungen sind jetzt aktiv.');
          if (activeTab === 'admin') renderApp();
        } else {
          showToast('Berechtigung für Benachrichtigungen wurde abgelehnt.', 'warning');
        }
      } catch (e) {
        showToast('Fehler bei der Benachrichtigungs-Anfrage.', 'error');
      }
    }

    async function sendPushNotification(title, body, isTest = false) {
      let sentAny = false;

      // 1. Browser Notification API
      if ('Notification' in window && Notification.permission === 'granted' && (state.push.browserEnabled || isTest)) {
        try {
          new Notification(title, { body, icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🏠</text></svg>' });
          sentAny = true;
        } catch (e) {
          console.warn('Browser Notification Fehler:', e);
        }
      }

      // 2. ntfy.sh Webhook für echte Handy-Push-Nachrichten
      const topic = (state.push.ntfyTopic || '').trim();
      if (topic) {
        try {
          await fetch(`https://ntfy.sh/${encodeURIComponent(topic)}`, {
            method: 'POST',
            body: body,
            headers: {
              'Title': title,
              'Tags': 'house,bell'
            }
          });
          sentAny = true;
        } catch (e) {
          console.warn('ntfy.sh Push Fehler:', e);
          if (isTest) showToast('ntfy.sh konnte nicht erreicht werden.', 'error');
        }
      }

      if (isTest) {
        if (sentAny) showToast('Test-Push erfolgreich gesendet!', 'success');
        else showToast('Bitte zuerst Browser-Push erlauben oder ein ntfy.sh Topic eintragen.', 'warning');
      }
    }

    function updateSyncBadge(status = 'local') {
      const dot = document.getElementById('header-sync-dot');
      const label = document.getElementById('header-sync-label');
      const side = document.getElementById('sidebar-sync-status');

      const map = {
        local: { dot: 'bg-emerald-500', text: 'Lokal gespeichert', short: 'Lokal' },
        syncing: { dot: 'bg-amber-400 animate-pulse', text: 'Synchronisiert...', short: 'Sync...' },
        synced: { dot: 'bg-sky-500', text: 'OneDrive aktuell', short: 'OneDrive' },
        error: { dot: 'bg-rose-500', text: 'Sync-Fehler', short: 'Fehler' }
      };
      const cfg = map[status] || map.local;
      if (dot) dot.className = `w-2 h-2 rounded-full ${cfg.dot}`;
      if (label) label.textContent = cfg.short;

    function getMsalInstance() {
      const clientId = (state.sync.oneDriveClientId || '').trim();
      if (!clientId) {
        showToast('Bitte zuerst eine Microsoft Entra ID Client-ID eingeben.', 'warning');
        return null;
      }
      if (typeof msal === 'undefined') {
        showToast('MSAL Bibliothek wird geladen oder ist offline.', 'error');
        return null;
      }
      if (!msalInstance || msalInstance.config?.auth?.clientId !== clientId) {
        msalInstance = new msal.PublicClientApplication({
          auth: {
            clientId: clientId,
            authority: 'https://login.microsoftonline.com/consumers',
            redirectUri: window.location.href.split('#')[0].split('?')[0]
          },
          cache: { cacheLocation: 'localStorage' }
        });
      }
      return msalInstance;
    }

    async function getOneDriveToken() {
      const client = getMsalInstance();
      if (!client) return null;
      const scopes = ['Files.ReadWrite', 'User.Read'];
      const accounts = client.getAllAccounts();
      if (accounts.length > 0) {
        oneDriveAccount = accounts[0];
        try {
          const res = await client.acquireTokenSilent({ scopes, account: oneDriveAccount });
          return res.accessToken;
        } catch (e) {
          const res = await client.acquireTokenPopup({ scopes });
          oneDriveAccount = res.account;
          return res.accessToken;
        }
      } else {
        const res = await client.loginPopup({ scopes });
        oneDriveAccount = res.account;
        return res.accessToken;
      }
    }

    async function syncToOneDrive(silent = false) {
      try {
        updateSyncBadge('syncing');
        const token = await getOneDriveToken();
        if (!token) { updateSyncBadge('local'); return; }
        const path = (state.sync.oneDrivePath || '/FamilienHub/daten.json').replace(/^\/+/, '');
        const url = `https://graph.microsoft.com/v1.0/me/drive/root:/${encodeURI(path)}:/content`;
        const resp = await fetch(url, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(state, null, 2)
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        state.sync.lastSync = new Date().toLocaleString('de-CH');
        saveState(false);
        updateSyncBadge('synced');
        if (!silent) {
          showToast('Erfolgreich auf OneDrive gespeichert!', 'success');
          if (activeTab === 'admin') renderApp();
        }
      } catch (e) {
        console.error('OneDrive Upload Fehler:', e);
        updateSyncBadge('error');
        if (!silent) showToast('OneDrive-Upload fehlgeschlagen. Prüfe Client-ID & Redirect-URI.', 'error');
      }
    }

    async function loadFromOneDrive() {
      try {
        updateSyncBadge('syncing');
        const token = await getOneDriveToken();
        if (!token) { updateSyncBadge('local'); return; }
        const path = (state.sync.oneDrivePath || '/FamilienHub/daten.json').replace(/^\/+/, '');
        const url = `https://graph.microsoft.com/v1.0/me/drive/root:/${encodeURI(path)}:/content`;
        const resp = await fetch(url, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const cloudData = await resp.json();
        state = { ...structuredClone(DEFAULT_STATE), ...cloudData };
        state.sync.lastSync = new Date().toLocaleString('de-CH');
        saveState(false);
        updateSyncBadge('synced');
        renderApp();
        showToast('Daten erfolgreich von OneDrive geladen!', 'success');
      } catch (e) {
        console.error('OneDrive Download Fehler:', e);
        updateSyncBadge('error');
        showToast('Konnte Datei nicht von OneDrive laden.', 'error');
      }
    }

    function exportJsonBackup() {
      try {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `familienhub-backup-${todayISO()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('JSON-Backup heruntergeladen (kann direkt in OneDrive gespeichert werden).', 'success');
      } catch (e) {
        showToast('Export fehlgeschlagen.', 'error');
      }
    }

    function triggerJsonImport() {
      document.getElementById('json-import-input').click();
    }

    function handleJsonImport(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (!imported.members || !imported.shopping) {
            throw new Error('Ungültiges Format');
          }
          state = { ...structuredClone(DEFAULT_STATE), ...imported };
          saveState(false);
          renderApp();
          showToast('Backup erfolgreich wiederhergestellt!', 'success');
        } catch (err) {
          showToast('Ungültige JSON-Datei.', 'error');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // =========================================================================
    // 9. AUTOMATISCHE VERBRAUCHS-PRÜFUNG (EINKAUFSLISTE)
    // =========================================================================
    function syncDueConsumptionItems(silent = false) {
      let addedCount = 0;
      const addedNames = [];

      state.shopping.consumption.forEach(cItem => {
        const info = getConsumptionStatus(cItem);
        if (info.status === 'due') {
          const alreadyOnList = state.shopping.items.some(
            s => !s.checked && (s.consumptionId === cItem.id || s.name.toLowerCase() === cItem.name.toLowerCase())
          );
          if (!alreadyOnList) {
            state.shopping.items.unshift({
              id: uid('s'),
              name: cItem.name,
              qty: cItem.qty,
              category: cItem.category,
              checked: false,
              consumptionId: cItem.id
            });
            addedCount++;
            addedNames.push(cItem.name);
          }
        }
      });

      if (addedCount > 0) {
        saveState();
        if (!silent) {
          showToast(`${addedCount} fällige(r) Artikel auf die Einkaufsliste gesetzt!`, 'success');
        }
        if (state.push.notifyOnShopping) {
          sendPushNotification('Einkaufsliste aktualisiert', `Automatisch ergänzt: ${addedNames.join(', ')}`);
        }
      } else if (!silent) {
        showToast('Alle fälligen Artikel sind bereits auf der Einkaufsliste.', 'info');
      }
      return addedCount;
    }

              <div class="flex items-center justify-between">
                <h3 class="font-bold text-slate-900 flex items-center gap-2"><i data-lucide="utensils" class="w-4 h-4 text-emerald-600"></i> Menü heute (${esc(todayMenu.day)})</h3>
                <button onclick="setTab('helpers')" class="text-xs font-semibold text-indigo-600 hover:underline">Plan</button>

                ${openTasks.slice(0, 4).map(t => {
                  const m = getMember(t.memberId);

                      <button onclick="toggleTask('${t.id}')" class="w-6 h-6 rounded-lg border-2 border-slate-300 hover:border-indigo-500 flex items-center justify-center shrink-0 transition"></button>

                        <p class="font-semibold text-sm text-slate-800 truncate">${esc(t.title)}</p>

    // =========================================================================
    // 12. ANSICHT: FAMILIENKALENDER + GOOGLE KALENDER
    // =========================================================================
    function renderCalendarView() {
      const hasGoogle = !!(state.calendar.googleEmbedUrl || '').trim();

      let contentHtml = '';
      if (calendarMode === 'google') {
        if (hasGoogle) {
          contentHtml = `
            <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden">
              <div class="p-4 border-b border-slate-100 flex items-center justify-between">
                <span class="text-sm font-bold text-slate-800 flex items-center gap-2">
                  <i data-lucide="globe" class="w-4 h-4 text-indigo-600"></i> Eingebetteter Google Kalender
                </span>
                ${isAdmin() ? `<button onclick="setTab('admin')" class="text-xs font-semibold text-indigo-600 hover:underline">URL anpassen</button>` : ''}
              </div>
              <iframe src="${esc(state.calendar.googleEmbedUrl)}" class="w-full h-[65vh] min-h-[480px] border-0" loading="lazy"></iframe>
            </div>
          `;
        } else {
          contentHtml = `
            <div class="bg-white rounded-3xl border border-slate-200/80 p-8 text-center space-y-3">
              <div class="w-14 h-14 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto">
                <i data-lucide="calendar-sync" class="w-7 h-7"></i>
              </div>
              <h3 class="text-lg font-bold text-slate-900">Google Kalender noch nicht verknüpft</h3>
              <p class="text-sm text-slate-500 max-w-md mx-auto">
                Im Admin-Bereich unter <strong>Cloud & Admin</strong> kann die Google-Kalender-Einbettungs-URL (iframe) oder ICS-Feed-URL eingetragen werden.
              </p>
              ${isAdmin() ? `<button onclick="setTab('admin')" class="mt-2 px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold transition">Jetzt einrichten</button>` : ''}
            </div>
          `;
        }
      } else {
        // Eigener Kalender (Monat oder Agenda)
        const year = calendarCursor.getFullYear();
        const month = calendarCursor.getMonth();
        const monthName = calendarCursor.toLocaleDateString('de-CH', { month: 'long', year: 'numeric' });

        if (calendarView === 'month') {
          const firstDay = new Date(year, month, 1);
          const lastDay = new Date(year, month + 1, 0);
          const startWeekday = (firstDay.getDay() + 6) % 7; // Mo = 0
          const totalDays = lastDay.getDate();
          const todayStr = todayISO();

          let cells = '';
          for (let i = 0; i < startWeekday; i++) {
            cells += `<div class="min-h-[74px] sm:min-h-[96px] bg-slate-50/60 border-b border-r border-slate-100 p-1.5"></div>`;
          }
          for (let d = 1; d <= totalDays; d++) {
            const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const dayEvents = state.calendar.events.filter(e => e.date === iso).sort((a,b) => (a.time||'').localeCompare(b.time||''));
            const isToday = iso === todayStr;

            cells += `
              <div onclick="openDayDetailModal('${iso}')" class="min-h-[74px] sm:min-h-[96px] bg-white hover:bg-indigo-50/30 border-b border-r border-slate-100 p-1.5 cursor-pointer transition flex flex-col">
                <div class="flex items-center justify-between mb-1">
                  <span class="text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full ${isToday ? 'bg-indigo-600 text-white' : 'text-slate-700'}">${d}</span>
                  ${dayEvents.length > 0 ? `<span class="sm:hidden w-1.5 h-1.5 rounded-full bg-indigo-500"></span>` : ''}
                </div>
                <div class="space-y-1 flex-1 overflow-hidden">
                  ${dayEvents.slice(0, 3).map(ev => {
                    const m = getMember(ev.memberId);
                    return `
                      <div class="text-[10px] sm:text-[11px] font-semibold px-1.5 py-0.5 rounded-md truncate text-white" style="background:${m.color}">
                        ${ev.time ? esc(ev.time) + ' ' : ''}${esc(ev.title)}
                      </div>
                    `;
                  }).join('')}
                  ${dayEvents.length > 3 ? `<div class="text-[10px] font-semibold text-slate-400 pl-1">+${dayEvents.length - 3} weitere</div>` : ''}
                </div>
              </div>
            `;
          }

          contentHtml = `
            <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden">
              <div class="p-4 border-b border-slate-100 flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <button onclick="shiftCalendarMonth(-1)" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 transition"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                  <h3 class="font-bold text-slate-900 capitalize min-w-[150px] text-center">${monthName}</h3>
                  <button onclick="shiftCalendarMonth(1)" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 transition"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                </div>
                <button onclick="calendarCursor = new Date(); renderApp();" class="px-3 py-1.5 rounded-xl bg-indigo-50 text-indigo-700 text-xs font-semibold hover:bg-indigo-100 transition">Heute</button>
              </div>
              <div class="grid grid-cols-7 bg-slate-50 border-b border-slate-200/80 text-center text-[11px] font-bold text-slate-500 uppercase py-2">
                <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
              </div>
              <div class="grid grid-cols-7 border-l border-slate-100">
                ${cells}
              </div>
            </div>
          `;
        } else {
          // Agenda-Ansicht
          const sorted = [...state.calendar.events].sort((a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || ''));
          contentHtml = `
            <div class="space-y-3">
              ${sorted.map(ev => {
                const m = getMember(ev.memberId);
                return `
                  <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3.5 min-w-0">
                      <div class="w-2 h-12 rounded-full shrink-0" style="background:${m.color}"></div>
                      <div class="min-w-0">
                        <div class="flex items-center gap-2 flex-wrap">
                          <span class="font-bold text-slate-900">${esc(ev.title)}</span>
                          <span class="text-xs px-2 py-0.5 rounded-full font-semibold bg-slate-100 text-slate-600">${esc(m.avatar)} ${esc(m.short)}</span>
                        </div>
                        <p class="text-xs text-slate-500 mt-1">
                          📅 ${formatDateCH(ev.date)} ${ev.time ? '• ⏰ ' + esc(ev.time) + ' Uhr' : ''} ${ev.location ? '• 📍 ' + esc(ev.location) : ''}
                        </p>
                        ${ev.notes ? `<p class="text-xs text-slate-400 mt-0.5">${esc(ev.notes)}</p>` : ''}
                      </div>
                    </div>
                    ${canEdit() ? `
                      <div class="flex items-center gap-1 shrink-0">
                        <button onclick="openEventModal('${ev.id}')" class="p-2.5 rounded-xl text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 transition"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                        <button onclick="deleteEvent('${ev.id}')" class="p-2.5 rounded-xl text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('') || '<div class="bg-white rounded-3xl p-8 text-center text-slate-400 border border-slate-200/80">Keine Termine vorhanden.</div>'}
            </div>
          `;
        }
      }

      // Farblegende Familienmitglieder
      const legendHtml = `
        <div class="flex flex-wrap items-center gap-2">
          ${[{ id: 'all', short: 'Alle', color: '#6366f1', avatar: '👨‍👩‍👧‍👦' }, ...state.members].map(m => `
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-white border border-slate-200 text-xs font-medium text-slate-700">
              <span class="w-2.5 h-2.5 rounded-full" style="background:${m.color}"></span>
              ${esc(m.short)}
            </span>
          `).join('')}
        </div>
      `;

      return `
        <div class="space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex items-center gap-2 flex-wrap">
              <div class="inline-flex p-1 rounded-2xl bg-slate-200/70">
                <button onclick="calendarMode='own'; renderApp();" class="px-3.5 py-2 rounded-xl text-xs font-bold transition ${calendarMode === 'own' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">Familienkalender</button>
                <button onclick="calendarMode='google'; renderApp();" class="px-3.5 py-2 rounded-xl text-xs font-bold transition ${calendarMode === 'google' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">Google Kalender</button>
              </div>
              ${calendarMode === 'own' ? `
                <div class="inline-flex p-1 rounded-2xl bg-slate-200/70">
                  <button onclick="calendarView='month'; renderApp();" class="px-3 py-2 rounded-xl text-xs font-bold transition ${calendarView === 'month' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">Monat</button>
                  <button onclick="calendarView='agenda'; renderApp();" class="px-3 py-2 rounded-xl text-xs font-bold transition ${calendarView === 'agenda' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">Agenda</button>
                </div>
              ` : ''}
            </div>
            ${canEdit() && calendarMode === 'own' ? `
              <button onclick="openEventModal()" class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold shadow-sm transition min-h-[44px]">
                <i data-lucide="plus" class="w-4 h-4"></i> Neuer Termin
              </button>
            ` : ''}
          </div>

          ${calendarMode === 'own' ? legendHtml : ''}
          ${contentHtml}
        </div>
      `;
    }

    function shiftCalendarMonth(delta) {
      calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() + delta, 1);
      renderApp();
    }

    function openDayDetailModal(isoDate) {
      const events = state.calendar.events.filter(e => e.date === isoDate).sort((a,b) => (a.time||'').localeCompare(b.time||''));
      openModal(`Termine am ${formatDateCH(isoDate)}`, `
        <div class="space-y-3">
          ${events.map(ev => {
            const m = getMember(ev.memberId);
            return `
              <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/80 flex items-start justify-between gap-2">
                <div class="flex items-start gap-3">
                  <div class="w-2 h-10 rounded-full mt-0.5 shrink-0" style="background:${m.color}"></div>
                  <div>
                    <p class="font-bold text-slate-900 text-sm">${esc(ev.title)}</p>
                    <p class="text-xs text-slate-500 mt-0.5">${ev.time ? esc(ev.time) + ' Uhr • ' : ''}${esc(m.avatar)} ${esc(m.short)} ${ev.location ? '• ' + esc(ev.location) : ''}</p>
                    ${ev.notes ? `<p class="text-xs text-slate-500 mt-1">${esc(ev.notes)}</p>` : ''}
                  </div>
                </div>
                ${canEdit() ? `
                  <div class="flex gap-1">
                    <button onclick="openEventModal('${ev.id}')" class="p-2 rounded-lg text-slate-400 hover:text-indigo-600 hover:bg-white"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                    <button onclick="deleteEvent('${ev.id}'); closeModal();" class="p-2 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-white"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                  </div>
                ` : ''}
              </div>
            `;
          }).join('') || '<p class="text-sm text-slate-400 text-center py-4">Keine Termine an diesem Tag.</p>'}
          ${canEdit() ? `
            <button onclick="openEventModal(null, '${isoDate}')" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm transition">
              + Termin für ${formatDateCH(isoDate)} hinzufügen
            </button>
          ` : ''}
        </div>
      `);
    }

    function openEventModal(eventId = null, defaultDate = null) {
      if (!canEdit()) return;
      const ev = eventId ? state.calendar.events.find(e => e.id === eventId) : null;
      const memberOptions = [
        `<option value="all" ${(!ev || ev.memberId === 'all') ? 'selected' : ''}>👨‍👩‍👧‍👦 Ganze Familie</option>`,
        ...state.members.map(m => `<option value="${m.id}" ${ev && ev.memberId === m.id ? 'selected' : ''}>${esc(m.avatar)} ${esc(m.name)}</option>`)
      ].join('');

      openModal(ev ? 'Termin bearbeiten' : 'Neuer Termin', `
        <form onsubmit="saveEventForm(event, '${ev ? ev.id : ''}')" class="space-y-3.5">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Titel *</label>
            <input id="ev-title" required value="${esc(ev?.title || '')}" placeholder="z.B. Fussballtraining, Arzttermin" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Datum *</label>
              <input id="ev-date" type="date" required value="${esc(ev?.date || defaultDate || todayISO())}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Uhrzeit</label>
              <input id="ev-time" type="time" value="${esc(ev?.time || '')}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Für wen?</label>
              <select id="ev-member" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm bg-white">${memberOptions}</select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Ort</label>
              <input id="ev-location" value="${esc(ev?.location || '')}" placeholder="z.B. Schulhaus" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Notizen</label>
            <textarea id="ev-notes" rows="2" placeholder="Optionale Infos..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">${esc(ev?.notes || '')}</textarea>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-semibold text-sm">Abbrechen</button>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm">Speichern</button>
          </div>
        </form>
      `);
    }

    function saveEventForm(e, eventId) {
      e.preventDefault();
      const data = {
        id: eventId || uid('e'),
        title: document.getElementById('ev-title').value.trim(),
        date: document.getElementById('ev-date').value,
        time: document.getElementById('ev-time').value,
        memberId: document.getElementById('ev-member').value,
        location: document.getElementById('ev-location').value.trim(),
        notes: document.getElementById('ev-notes').value.trim()
      };
      if (eventId) {
        const idx = state.calendar.events.findIndex(x => x.id === eventId);
        if (idx >= 0) state.calendar.events[idx] = data;
      } else {
        state.calendar.events.push(data);
        if (state.push.notifyOnEvent) {
          sendPushNotification('Neuer Familientermin', `${data.title} am ${formatDateCH(data.date)} ${data.time ? 'um ' + data.time : ''}`);
        }
      }
      saveState();
      closeModal();
      renderApp();
      showToast(eventId ? 'Termin aktualisiert' : 'Termin erstellt', 'success');
    }

    function deleteEvent(id) {
      if (!canEdit()) return;
      openConfirmModal('Termin löschen', 'Möchtest du diesen Termin wirklich löschen?', () => {
        state.calendar.events = state.calendar.events.filter(e => e.id !== id);
        saveState();
        renderApp();
        showToast('Termin gelöscht', 'info');
      });
    }

    // =========================================================================
    // 13. ANSICHT: AUFGABEN-MANAGER
    // =========================================================================
    function renderTasksView() {
      const filtered = state.tasks.filter(t => {
        if (taskFilterMember !== 'all' && t.memberId !== taskFilterMember) return false;
        if (taskFilterStatus === 'open' && t.done) return false;
        if (taskFilterStatus === 'done' && !t.done) return false;
        return true;
      }).sort((a, b) => Number(a.done) - Number(b.done) || (a.dueDate || '').localeCompare(b.dueDate || ''));

      const prioStyles = {
        hoch: 'bg-rose-100 text-rose-700',
        mittel: 'bg-amber-100 text-amber-700',
        niedrig: 'bg-slate-100 text-slate-600'
      };

      return `
        <div class="space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2">
              <select onchange="taskFilterMember=this.value; renderApp();" class="px-3.5 py-2.5 rounded-xl bg-white border border-slate-200 text-xs font-semibold text-slate-700 min-h-[42px]">
                <option value="all" ${taskFilterMember === 'all' ? 'selected' : ''}>Alle Personen</option>
                ${state.members.map(m => `<option value="${m.id}" ${taskFilterMember === m.id ? 'selected' : ''}>${esc(m.avatar)} ${esc(m.short)}</option>`).join('')}
              </select>
              <div class="inline-flex p-1 rounded-xl bg-slate-200/70">
                ${[['all', 'Alle'], ['open', 'Offen'], ['done', 'Erledigt']].map(([val, lbl]) => `
                  <button onclick="taskFilterStatus='${val}'; renderApp();" class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${taskFilterStatus === val ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">${lbl}</button>
                `).join('')}
              </div>
            </div>
            ${canEdit() ? `
              <button onclick="openTaskModal()" class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold shadow-sm transition min-h-[44px]">
                <i data-lucide="plus" class="w-4 h-4"></i> Neue Aufgabe
              </button>
            ` : ''}
          </div>

          <div class="space-y-2.5">
            ${filtered.map(t => {
              const m = getMember(t.memberId);
              const overdue = !t.done && t.dueDate && t.dueDate < todayISO();
              return `
                <div class="bg-white rounded-2xl p-4 border ${t.done ? 'border-slate-100 opacity-75' : 'border-slate-200/80'} shadow-sm flex items-center justify-between gap-3">
                  <div class="flex items-center gap-3.5 min-w-0">
                    ${canEdit() ? `
                      <button onclick="toggleTask('${t.id}')" class="w-7 h-7 rounded-xl border-2 flex items-center justify-center shrink-0 transition ${t.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 hover:border-indigo-500'}">
                        ${t.done ? '<i data-lucide="check" class="w-4 h-4"></i>' : ''}
                      </button>
                    ` : `
                      <div class="w-7 h-7 rounded-xl flex items-center justify-center shrink-0 ${t.done ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-400'}">
                        <i data-lucide="${t.done ? 'check' : 'circle'}" class="w-4 h-4"></i>
                      </div>
                    `}
                    <div class="min-w-0">
                      <p class="font-bold text-sm sm:text-base ${t.done ? 'line-through text-slate-400' : 'text-slate-900'}">${esc(t.title)}</p>
                      <div class="flex items-center gap-2 flex-wrap mt-1">
                        <span class="text-xs text-slate-500">${esc(m.avatar)} ${esc(m.short)}</span>
                        <span class="text-xs font-medium ${overdue ? 'text-rose-600 font-bold' : 'text-slate-500'}">📅 ${formatDateCH(t.dueDate)}</span>
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded-full uppercase ${prioStyles[t.priority] || prioStyles.mittel}">${esc(t.priority)}</span>
                      </div>
                    </div>
                  </div>
                  ${canEdit() ? `
                    <div class="flex items-center gap-1 shrink-0">
                      <button onclick="openTaskModal('${t.id}')" class="p-2.5 rounded-xl text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 transition"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                      <button onclick="deleteTask('${t.id}')" class="p-2.5 rounded-xl text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('') || '<div class="bg-white rounded-3xl p-8 text-center text-slate-400 border border-slate-200/80">Keine Aufgaben für diesen Filter gefunden.</div>'}
          </div>
        </div>
      `;
    }

    function toggleTask(id) {
      if (!canEdit()) return;
      const t = state.tasks.find(x => x.id === id);
      if (t) {
        t.done = !t.done;
        saveState();
        renderApp();
      }
    }

    function openTaskModal(taskId = null) {
      if (!canEdit()) return;
      const t = taskId ? state.tasks.find(x => x.id === taskId) : null;
      openModal(t ? 'Aufgabe bearbeiten' : 'Neue Aufgabe', `
        <form onsubmit="saveTaskForm(event, '${t ? t.id : ''}')" class="space-y-3.5">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Aufgabe *</label>
            <input id="tk-title" required value="${esc(t?.title || '')}" placeholder="Was muss erledigt werden?" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Zuständig</label>
              <select id="tk-member" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm bg-white">
                ${state.members.map(m => `<option value="${m.id}" ${t && t.memberId === m.id ? 'selected' : ''}>${esc(m.avatar)} ${esc(m.name)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Fällig bis</label>
              <input id="tk-due" type="date" value="${esc(t?.dueDate || todayISO())}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Priorität</label>
            <select id="tk-prio" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm bg-white">
              <option value="hoch" ${t?.priority === 'hoch' ? 'selected' : ''}>🔴 Hoch</option>
              <option value="mittel" ${(!t || t.priority === 'mittel') ? 'selected' : ''}>🟠 Mittel</option>
              <option value="niedrig" ${t?.priority === 'niedrig' ? 'selected' : ''}>⚪ Niedrig</option>
            </select>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-semibold text-sm">Abbrechen</button>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm">Speichern</button>
          </div>
        </form>
      `);
    }

    function saveTaskForm(e, taskId) {
      e.preventDefault();
      const data = {
        id: taskId || uid('t'),
        title: document.getElementById('tk-title').value.trim(),
        memberId: document.getElementById('tk-member').value,
        dueDate: document.getElementById('tk-due').value,
        priority: document.getElementById('tk-prio').value,
        done: taskId ? (state.tasks.find(x => x.id === taskId)?.done || false) : false
      };
      if (taskId) {
        const idx = state.tasks.findIndex(x => x.id === taskId);
        if (idx >= 0) state.tasks[idx] = data;
      } else {
        state.tasks.unshift(data);
        if (state.push.notifyOnTask) {
          const m = getMember(data.memberId);
          sendPushNotification('Neue Familienaufgabe', `${data.title} (${m.short}, bis ${formatDateCH(data.dueDate)})`);
        }
      }
      saveState();
      closeModal();
      renderApp();
      showToast(taskId ? 'Aufgabe aktualisiert' : 'Aufgabe hinzugefügt', 'success');
    }

    function deleteTask(id) {
      if (!canEdit()) return;
      openConfirmModal('Aufgabe löschen', 'Soll diese Aufgabe wirklich entfernt werden?', () => {
        state.tasks = state.tasks.filter(t => t.id !== id);
        saveState();
        renderApp();
        showToast('Aufgabe gelöscht', 'info');
      });
    }

    // =========================================================================
    // 14. ANSICHT: SMARTE EINKAUFSLISTE & VERBRAUCHSAUTOMATIK
    // =========================================================================
    function renderShoppingView() {
      const dueCount = state.shopping.consumption.filter(c => getConsumptionStatus(c).status === 'due').length;

      let bodyHtml = '';
      if (shoppingSubTab === 'list') {
        const grouped = {};
        SHOPPING_CATEGORIES.forEach(c => grouped[c] = []);
        state.shopping.items.forEach(item => {
          const cat = SHOPPING_CATEGORIES.includes(item.category) ? item.category : 'Sonstiges';
          grouped[cat].push(item);
        });

        const checkedCount = state.shopping.items.filter(i => i.checked).length;

        bodyHtml = `
          ${canEdit() ? `
            <form onsubmit="quickAddShoppingItem(event)" class="bg-white rounded-2xl p-3.5 border border-slate-200/80 shadow-sm flex flex-col sm:flex-row gap-2.5">
              <input id="quick-shop-name" required placeholder="Artikel hinzufügen (z.B. Butter, Gurke...)" class="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <div class="flex gap-2">
                <input id="quick-shop-qty" placeholder="Menge" class="w-24 sm:w-28 px-3 py-2.5 rounded-xl border border-slate-200 text-sm">
                <select id="quick-shop-cat" class="flex-1 sm:w-40 px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-white">
                  ${SHOPPING_CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('')}
                </select>
                <button type="submit" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shrink-0 min-h-[44px]">
                  <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
              </div>
            </form>
          ` : ''}

          <div class="space-y-4">
            ${SHOPPING_CATEGORIES.map(cat => {
              const list = grouped[cat];
              if (list.length === 0) return '';
              return `
                <div class="bg-white rounded-3xl p-4 sm:p-5 border border-slate-200/80 shadow-sm">
                  <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-400 mb-3">${cat} (${list.filter(i => !i.checked).length})</h3>
                  <div class="divide-y divide-slate-100">
                    ${list.map(item => `
                      <div class="py-2.5 flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3 min-w-0">
                          ${canEdit() ? `
                            <button onclick="toggleShoppingItem('${item.id}')" class="w-7 h-7 rounded-xl border-2 flex items-center justify-center shrink-0 transition ${item.checked ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 hover:border-indigo-500'}">
                              ${item.checked ? '<i data-lucide="check" class="w-4 h-4"></i>' : ''}
                            </button>
                          ` : `
                            <span class="w-2.5 h-2.5 rounded-full ${item.checked ? 'bg-emerald-400' : 'bg-indigo-400'}"></span>
                          `}
                          <div class="min-w-0">
                            <p class="font-semibold text-sm ${item.checked ? 'line-through text-slate-400' : 'text-slate-900'}">
                              ${esc(item.name)}
                              ${item.consumptionId ? '<span class="ml-1.5 text-[10px] font-bold px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-600">Auto</span>' : ''}
                            </p>
                            ${item.qty ? `<p class="text-xs text-slate-500">${esc(item.qty)}</p>` : ''}
                          </div>
                        </div>
                        ${canEdit() ? `
                          <button onclick="deleteShoppingItem('${item.id}')" class="p-2 rounded-xl text-slate-300 hover:text-rose-600 hover:bg-rose-50 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        ` : ''}
                      </div>
                    `).join('')}
                  </div>
                </div>
              `;
            }).join('') || '<div class="bg-white rounded-3xl p-8 text-center text-slate-400 border border-slate-200/80">Die Einkaufsliste ist leer.</div>'}
          </div>

          ${canEdit() && checkedCount > 0 ? `
            <div class="flex justify-end">
              <button onclick="clearCheckedShopping()" class="px-4 py-2.5 rounded-xl bg-slate-200/80 hover:bg-slate-300/80 text-slate-700 text-xs font-bold transition min-h-[42px]">
                Erledigte Artikel aufräumen (${checkedCount})
              </button>
            </div>
          ` : ''}
        `;
      } else {
        // Tab 2: Verbrauch & Automatik
        const sortedCons = [...state.shopping.consumption].sort((a, b) => getConsumptionStatus(a).remaining - getConsumptionStatus(b).remaining);

        bodyHtml = `
          <div class="bg-indigo-50/70 border border-indigo-100 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h4 class="font-bold text-sm text-indigo-950">Intelligente Verbrauchsautomatik</h4>
              <p class="text-xs text-indigo-800/80 mt-0.5">Berechnet anhand des letzten Kaufdatums & Intervalls, was bald ausgeht. Beim Abhaken auf der Einkaufsliste wird das Datum automatisch erneuert.</p>
            </div>
            ${canEdit() ? `
              <div class="flex items-center gap-2 shrink-0">
                <button onclick="syncDueConsumptionItems(false); renderApp();" class="px-3.5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition min-h-[42px]">
                  Fällige auf Liste (${dueCount})
                </button>
                <button onclick="openConsumptionModal()" class="px-3.5 py-2.5 rounded-xl bg-white border border-indigo-200 text-indigo-700 hover:bg-indigo-50 text-xs font-bold transition min-h-[42px]">
                  + Artikel
                </button>
              </div>
            ` : ''}
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
            ${sortedCons.map(c => {
              const st = getConsumptionStatus(c);
              const badgeClass = st.status === 'due'
                ? 'bg-rose-100 text-rose-700'
                : st.status === 'soon'
                  ? 'bg-amber-100 text-amber-800'
                  : 'bg-emerald-100 text-emerald-700';
              const barClass = st.status === 'due'
                ? 'bg-rose-500'
                : st.status === 'soon'
                  ? 'bg-amber-500'
                  : 'bg-emerald-500';
              const statusText = st.remaining <= 0
                ? (st.remaining === 0 ? 'Heute fällig' : `Seit ${Math.abs(st.remaining)} T. fällig`)
                : `Noch ${st.remaining} ${st.remaining === 1 ? 'Tag' : 'Tage'}`;

              return `
                <div class="bg-white rounded-2xl p-4 border ${st.status === 'due' ? 'border-rose-200' : 'border-slate-200/80'} shadow-sm space-y-3">
                  <div class="flex items-start justify-between gap-2">
                    <div>
                      <h4 class="font-bold text-slate-900">${esc(c.name)} <span class="text-xs font-normal text-slate-500">(${esc(c.qty)})</span></h4>
                      <p class="text-xs text-slate-500 mt-0.5">${esc(c.category)} • Alle ${c.intervalDays} Tage • Zuletzt: ${formatDateCH(c.lastBought)}</p>
                    </div>
                    <span class="text-[11px] font-bold px-2.5 py-1 rounded-full shrink-0 ${badgeClass}">${statusText}</span>
                  </div>

                  <div class="w-full h-2.5 rounded-full bg-slate-100 overflow-hidden">
                    <div class="h-full rounded-full transition-all ${barClass}" style="width: ${st.pct}%"></div>
                  </div>

                  ${canEdit() ? `
                    <div class="flex items-center justify-between pt-1">
                      <button onclick="markConsumptionBoughtToday('${c.id}')" class="text-xs font-semibold text-emerald-700 hover:underline">Heute gekauft ✓</button>
                      <div class="flex items-center gap-1">
                        <button onclick="openConsumptionModal('${c.id}')" class="p-2 rounded-lg text-slate-400 hover:text-indigo-600 hover:bg-indigo-50"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                        <button onclick="deleteConsumptionItem('${c.id}')" class="p-2 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                      </div>
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      return `
        <div class="space-y-4">
          <div class="inline-flex p-1 rounded-2xl bg-slate-200/70">
            <button onclick="shoppingSubTab='list'; renderApp();" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${shoppingSubTab === 'list' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">
              Aktuelle Liste (${state.shopping.items.filter(i => !i.checked).length})
            </button>
            <button onclick="shoppingSubTab='consumption'; renderApp();" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition flex items-center gap-1.5 ${shoppingSubTab === 'consumption' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}">
              Verbrauch & Automatik
              ${dueCount > 0 ? `<span class="px-1.5 py-0.5 rounded-full bg-rose-500 text-white text-[10px]">${dueCount}</span>` : ''}
            </button>
          </div>
          ${bodyHtml}
        </div>
      `;
    }

    function quickAddShoppingItem(e) {
      e.preventDefault();
      if (!canEdit()) return;
      const name = document.getElementById('quick-shop-name').value.trim();
      const qty = document.getElementById('quick-shop-qty').value.trim();
      const category = document.getElementById('quick-shop-cat').value;
      if (!name) return;
      state.shopping.items.unshift({
        id: uid('s'),
        name,
        qty,
        category,
        checked: false,
        consumptionId: null
      });
      saveState();
      renderApp();
      showToast(`${name} zur Einkaufsliste hinzugefügt`, 'success');
    }

    function toggleShoppingItem(id) {
      if (!canEdit()) return;
      const item = state.shopping.items.find(i => i.id === id);
      if (!item) return;
      item.checked = !item.checked;
      // Wenn abgehakt und mit Verbrauchsartikel verknüpft -> Kaufdatum auf heute setzen!
      if (item.checked && item.consumptionId) {
        const cItem = state.shopping.consumption.find(c => c.id === item.consumptionId);
        if (cItem) {
          cItem.lastBought = todayISO();
          showToast(`Verbrauchsdatum für "${cItem.name}" auf heute aktualisiert`, 'info');
        }
      }
      saveState();
      renderApp();
    }

    function deleteShoppingItem(id) {
      if (!canEdit()) return;
      state.shopping.items = state.shopping.items.filter(i => i.id !== id);
      saveState();
      renderApp();
    }

    function clearCheckedShopping() {
      if (!canEdit()) return;
      state.shopping.items = state.shopping.items.filter(i => !i.checked);
      saveState();
      renderApp();
      showToast('Erledigte Artikel entfernt', 'info');
    }

    function markConsumptionBoughtToday(id) {
      if (!canEdit()) return;
      const c = state.shopping.consumption.find(x => x.id === id);
      if (c) {
        c.lastBought = todayISO();
        saveState();
        renderApp();
        showToast(`${c.name}: Kaufdatum auf heute gesetzt`, 'success');
      }
    }

    function openConsumptionModal(consId = null) {
      if (!canEdit()) return;
      const c = consId ? state.shopping.consumption.find(x => x.id === consId) : null;
      openModal(c ? 'Verbrauchsartikel bearbeiten' : 'Neuer Verbrauchsartikel', `
        <form onsubmit="saveConsumptionForm(event, '${c ? c.id : ''}')" class="space-y-3.5">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Artikelname *</label>
            <input id="cs-name" required value="${esc(c?.name || '')}" placeholder="z.B. Vollmilch, Waschmittel" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Standard-Menge</label>
              <input id="cs-qty" value="${esc(c?.qty || '1 Stk')}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Kategorie</label>
              <select id="cs-cat" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm bg-white">
                ${SHOPPING_CATEGORIES.map(cat => `<option value="${cat}" ${c?.category === cat ? 'selected' : ''}>${cat}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Verbrauchsintervall (Tage) *</label>
              <input id="cs-interval" type="number" min="1" max="365" required value="${c?.intervalDays || 7}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Zuletzt gekauft *</label>
              <input id="cs-last" type="date" required value="${esc(c?.lastBought || todayISO())}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
            </div>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-semibold text-sm">Abbrechen</button>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm">Speichern</button>
          </div>
        </form>
      `);
    }

    function saveConsumptionForm(e, consId) {
      e.preventDefault();
      const data = {
        id: consId || uid('c'),
        name: document.getElementById('cs-name').value.trim(),
        qty: document.getElementById('cs-qty').value.trim(),
        category: document.getElementById('cs-cat').value,
        intervalDays: Math.max(1, parseInt(document.getElementById('cs-interval').value, 10) || 7),
        lastBought: document.getElementById('cs-last').value
      };
      if (consId) {
        const idx = state.shopping.consumption.findIndex(x => x.id === consId);
        if (idx >= 0) state.shopping.consumption[idx] = data;
      } else {
        state.shopping.consumption.push(data);
      }
      saveState();
      closeModal();
      renderApp();
      showToast('Verbrauchsartikel gespeichert', 'success');
    }

    function deleteConsumptionItem(id) {
      if (!canEdit()) return;
      openConfirmModal('Artikel entfernen', 'Diesen wiederkehrenden Verbrauchsartikel löschen?', () => {
        state.shopping.consumption = state.shopping.consumption.filter(c => c.id !== id);
        saveState();
        renderApp();
      });
    }

    // =========================================================================
    // 15. ANSICHT: ÄMTLIPLAN (HAUSHALTSAUFGABEN & STERNE)
    // =========================================================================
    function renderAemtliView() {
      const kids = state.members.filter(m => m.roleType === 'child');

      return `
        <div class="space-y-5">
          <!-- Sterne-Übersicht pro Kind -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            ${kids.map(k => `
              <div class="bg-white rounded-3xl p-5 border border-slate-200/80 shadow-sm flex items-center justify-between">
                <div class="flex items-center gap-3.5">
                  <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl" style="background:${k.color}20">
                    ${esc(k.avatar)}
                  </div>
                  <div>
                    <h3 class="font-bold text-slate-900">${esc(k.name)}</h3>
                    <p class="text-xs text-slate-500">${state.aemtli.filter(a => a.memberId === k.id).length} Ämtli diese Woche</p>
                  </div>
                </div>
                <div class="text-right">
                  <div class="text-2xl font-extrabold text-amber-500">⭐ ${k.stars || 0}</div>
                  <div class="text-[11px] font-semibold text-slate-400">Sterne</div>
                </div>
              </div>
            `).join('')}
          </div>

          <!-- Aktionen (nur Eltern & Admin) -->
          ${canEdit() ? `
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex flex-wrap gap-2">
                <button onclick="rotateAemtli()" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs sm:text-sm font-bold shadow-sm transition min-h-[44px]">
                  <i data-lucide="refresh-cw" class="w-4 h-4"></i> Ämtli für nächste Woche rotieren
                </button>

                      <div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-xl shrink-0">${esc(a.icon || '✨')}</div>

                      </div>
                    </div>
                  </div>
                  ${canEdit() ? `
                    <div class="flex items-center gap-1 shrink-0">
                      <button onclick="openAemtliModal('${a.id}')" class="p-2 rounded-xl text-slate-400 hover:text-indigo-600 hover:bg-indigo-50"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                      <button onclick="deleteAemtli('${a.id}')" class="p-2 rounded-xl text-slate-400 hover:text-rose-600 hover:bg-rose-50"><i data-lucide="trash-2" class="w-4 h-4"></i></button>

                  ` : `
                    <span class="text-xs font-bold px-2.5 py-1 rounded-full shrink-0 ${a.doneToday ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}">
                      ${a.doneToday ? 'Erledigt ✓' : 'Offen'}
                    </span>
                  `}
                </div>
              `;

        </div>

    function toggleAemtli(id) {
      if (!canEdit()) return;
      const a = state.aemtli.find(x => x.id === id);
      if (!a) return;
      a.doneToday = !a.doneToday;
      const member = state.members.find(m => m.id === a.memberId);
      if (member) {
        member.stars = Math.max(0, (member.stars || 0) + (a.doneToday ? a.stars : -a.stars));
      }
      saveState();
      renderApp();
      if (a.doneToday && member) {
        showToast(`${member.short} erhält +${a.stars} Sterne! ⭐`, 'success');
      }
    }

    function rotateAemtli() {
      if (!canEdit()) return;
      const kids = state.members.filter(m => m.roleType === 'child');
      if (kids.length < 2) {
        showToast('Für eine Rotation braucht es mindestens 2 Kinder.', 'warning');
        return;
      }
      state.aemtli.forEach(a => {
        const idx = kids.findIndex(k => k.id === a.memberId);
        if (idx >= 0) {
          a.memberId = kids[(idx + 1) % kids.length].id;
        }
        a.doneToday = false;
      });
      saveState();
      renderApp();
      showToast('Ämtli erfolgreich für die nächste Woche rotiert!', 'success');
    }

    function resetAemtliDone() {
      if (!canEdit()) return;
      state.aemtli.forEach(a => a.doneToday = false);
      saveState();
      renderApp();
      showToast('Alle Ämtli wieder auf offen gesetzt', 'info');
    }

    function openAemtliModal(aemtliId = null) {
      if (!canEdit()) return;
      const a = aemtliId ? state.aemtli.find(x => x.id === aemtliId) : null;
      openModal(a ? 'Ämtli bearbeiten' : 'Neues Ämtli', `
        <form onsubmit="saveAemtliForm(event, '${a ? a.id : ''}')" class="space-y-3.5">
