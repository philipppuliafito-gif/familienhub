            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Icon</label>
              <input id="ae-icon" value="${esc(a?.icon || '✨')}" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-center text-lg">
            </div>
            <div class="col-span-3">
              <label class="block text-xs font-semibold text-slate-600 mb-1">Ämtli-Titel *</label>
              <input id="ae-title" required value="${esc(a?.title || '')}" placeholder="z.B. Tisch decken" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Zuständig</label>
              <select id="ae-member" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm bg-white">
                ${state.members.map(m => `<option value="${m.id}" ${a && a.memberId === m.id ? 'selected' : ''}>${esc(m.avatar)} ${esc(m.name)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Rhythmus</label>
              <input id="ae-freq" value="${esc(a?.frequency || 'Täglich')}" placeholder="z.B. Täglich, Samstag" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Belohnung (Sterne)</label>
            <input id="ae-stars" type="number" min="1" max="10" value="${a?.stars || 2}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-semibold text-sm">Abbrechen</button>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm">Speichern</button>
          </div>
        </form>
      `);
    }

    function saveAemtliForm(e, aemtliId) {
      e.preventDefault();
      const data = {
        id: aemtliId || uid('a'),
        icon: document.getElementById('ae-icon').value.trim() || '✨',
        title: document.getElementById('ae-title').value.trim(),
        memberId: document.getElementById('ae-member').value,
        frequency: document.getElementById('ae-freq').value.trim(),
        stars: parseInt(document.getElementById('ae-stars').value, 10) || 1,
        doneToday: aemtliId ? (state.aemtli.find(x => x.id === aemtliId)?.doneToday || false) : false
      };
      if (aemtliId) {
        const idx = state.aemtli.findIndex(x => x.id === aemtliId);
        if (idx >= 0) state.aemtli[idx] = data;
      } else {
        state.aemtli.push(data);
      }
      saveState();
      closeModal();
      renderApp();
      showToast('Ämtli gespeichert', 'success');
    }

    function deleteAemtli(id) {
      if (!canEdit()) return;
      openConfirmModal('Ämtli löschen', 'Dieses Ämtli wirklich aus dem Plan entfernen?', () => {
        state.aemtli = state.aemtli.filter(a => a.id !== id);
        saveState();
        renderApp();
      });
    }

            </div>
          </section>
        </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Telefonnummer *</label>
              <input id="ct-phone" required placeholder="079 000 00 00" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Kategorie</label>
              <input id="ct-cat" value="Familie" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
            </div>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-semibold text-sm">Abbrechen</button>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-semibold text-sm">Speichern</button>
          </div>
        </form>
      `);
    }

    function saveContactForm(e) {
      e.preventDefault();
      state.helpers.contacts.push({
        id: uid('ct'),
        name: document.getElementById('ct-name').value.trim(),
        phone: document.getElementById('ct-phone').value.trim(),
        category: document.getElementById('ct-cat').value.trim() || 'Sonstiges',
        urgent: false
      });
      saveState();
      closeModal();
      renderApp();
    }

    function deleteContact(id) {
      if (!canEdit()) return;
      state.helpers.contacts = state.helpers.contacts.filter(c => c.id !== id);
      saveState();
      renderApp();
    }

    // =========================================================================
    // 17. ANSICHT: CLOUD, PUSH & ADMIN (Nur Admin)
    // =========================================================================
    function renderAdminView() {
      if (!isAdmin()) return '<p class="text-slate-500">Nur für Administratoren zugänglich.</p>';

      const notifPerm = ('Notification' in window) ? Notification.permission : 'unsupported';

      return `
        <div class="space-y-6">
          <!-- 1. OneDrive Cloud & Backup -->
          <section class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200/80 shadow-sm space-y-4">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-sky-100 text-sky-600 flex items-center justify-center"><i data-lucide="cloud" class="w-5 h-5"></i></div>
                <div>
                  <h3 class="font-bold text-slate-900">OneDrive-Speicherung & Synchronisation</h3>
                  <p class="text-xs text-slate-500">Automatische Browser-Speicherung + Microsoft OneDrive Sync & JSON-Backup</p>
                </div>
              </div>
              ${state.sync.lastSync ? `<span class="text-xs font-semibold text-sky-700 bg-sky-50 px-3 py-1 rounded-full">Letzter Sync: ${esc(state.sync.lastSync)}</span>` : ''}
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Microsoft Entra ID Client-ID (optional für Direkt-Sync)</label>
                <input id="adm-od-client" value="${esc(state.sync.oneDriveClientId)}" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-mono">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">OneDrive-Dateipfad</label>
                <input id="adm-od-path" value="${esc(state.sync.oneDrivePath)}" placeholder="/FamilienHub/daten.json" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-mono">
              </div>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-3 pt-1">
              <label class="inline-flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer">
                <input type="checkbox" id="adm-od-auto" ${state.sync.autoSync ? 'checked' : ''} class="w-4 h-4 accent-indigo-600 rounded">
                Bei Änderungen automatisch auf OneDrive speichern
              </label>
              <button onclick="saveSyncSettings()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition min-h-[40px]">Einstellungen sichern</button>
            </div>

            <div class="pt-3 border-t border-slate-100 flex flex-wrap gap-2.5">
              <button onclick="syncToOneDrive(false)" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold transition min-h-[42px]">
                <i data-lucide="cloud-upload" class="w-4 h-4"></i> Auf OneDrive speichern
              </button>
              <button onclick="loadFromOneDrive()" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 text-xs font-bold transition min-h-[42px]">
                <i data-lucide="cloud-download" class="w-4 h-4"></i> Von OneDrive laden
              </button>
              <button onclick="exportJsonBackup()" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold transition min-h-[42px]">
                <i data-lucide="download" class="w-4 h-4"></i> 1-Klick JSON-Export (OneDrive Ordner)
              </button>
              <button onclick="triggerJsonImport()" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold transition min-h-[42px]">
                <i data-lucide="upload" class="w-4 h-4"></i> JSON-Import
              </button>
            </div>
          </section>

          <!-- 2. Push-Benachrichtigungen -->
          <section class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200/80 shadow-sm space-y-4">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-2xl bg-violet-100 text-violet-600 flex items-center justify-center"><i data-lucide="bell-ring" class="w-5 h-5"></i></div>
              <div>
                <h3 class="font-bold text-slate-900">Automatische Push-Benachrichtigungen aufs Handy</h3>
                <p class="text-xs text-slate-500">Nutze Browser-Push oder ein privates ntfy.sh Topic (kostenlose iOS/Android App)</p>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200/70 space-y-3">
                <div class="flex items-center justify-between">
                  <span class="text-sm font-bold text-slate-800">Browser-Benachrichtigungen</span>
                  <span class="text-[11px] font-bold px-2 py-0.5 rounded-full ${notifPerm === 'granted' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}">${notifPerm}</span>
                </div>
                <button onclick="requestBrowserPushPermission()" class="w-full py-2.5 rounded-xl bg-white border border-slate-300 hover:bg-slate-100 text-slate-800 text-xs font-bold transition min-h-[42px]">
                  Berechtigung anfragen / aktivieren
                </button>
              </div>

              <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200/70 space-y-2.5">
                <label class="block text-sm font-bold text-slate-800">ntfy.sh Topic (Handy-Push Webhook)</label>
                <input id="adm-ntfy-topic" value="${esc(state.push.ntfyTopic)}" placeholder="z.B. familienhub-meier-geheim99" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm bg-white">
                <p class="text-[11px] text-slate-500">Dieses Topic in der <strong>ntfy</strong> App auf dem Handy abonnieren für sofortige Pushs.</p>
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-4 text-xs font-semibold text-slate-700">
              <label class="inline-flex items-center gap-2"><input type="checkbox" id="adm-push-task" ${state.push.notifyOnTask ? 'checked' : ''} class="w-4 h-4 accent-indigo-600"> Bei neuen Aufgaben</label>
              <label class="inline-flex items-center gap-2"><input type="checkbox" id="adm-push-shop" ${state.push.notifyOnShopping ? 'checked' : ''} class="w-4 h-4 accent-indigo-600"> Bei fälligen Einkäufen</label>
              <label class="inline-flex items-center gap-2"><input type="checkbox" id="adm-push-ev" ${state.push.notifyOnEvent ? 'checked' : ''} class="w-4 h-4 accent-indigo-600"> Bei neuen Terminen</label>
            </div>

            <div class="flex flex-wrap gap-2 pt-1">
              <button onclick="savePushSettings()" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition min-h-[42px]">Push-Einstellungen speichern</button>
              <button onclick="savePushSettings(true); sendPushNotification('Test-Push FamilienHub', 'Hallo! Deine Push-Nachrichten funktionieren einwandfrei.', true);" class="px-4 py-2.5 rounded-xl bg-violet-100 hover:bg-violet-200 text-violet-800 text-xs font-bold transition min-h-[42px]">Test-Push senden</button>
            </div>
          </section>

          <!-- 3. Google Kalender Integration -->
          <section class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200/80 shadow-sm space-y-4">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center"><i data-lucide="calendar-sync" class="w-5 h-5"></i></div>
              <div>
                <h3 class="font-bold text-slate-900">Google-Kalender-Synchronisation</h3>
                <p class="text-xs text-slate-500">Embed-URL aus den Google-Kalender-Einstellungen ("Kalender integrieren") einfügen</p>
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Google Kalender Embed-URL (iframe src)</label>
                <input id="adm-gcal-embed" value="${esc(state.calendar.googleEmbedUrl)}" placeholder="https://calendar.google.com/calendar/embed?src=..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Privatadresse im iCal-Format (.ics, optional)</label>
                <input id="adm-gcal-ics" value="${esc(state.calendar.googleIcsUrl)}" placeholder="https://calendar.google.com/calendar/ical/.../basic.ics" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
              </div>
            </div>
            <button onclick="saveGoogleCalSettings()" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition min-h-[42px]">Google Kalender speichern</button>
          </section>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- 4. Familienmitglieder verwalten -->
            <section class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200/80 shadow-sm space-y-4">
              <div class="flex items-center justify-between">
                <h3 class="font-bold text-slate-900 flex items-center gap-2"><i data-lucide="users" class="w-5 h-5 text-indigo-600"></i> Familienmitglieder</h3>
                <button onclick="openMemberModal()" class="px-3 py-1.5 rounded-xl bg-indigo-50 text-indigo-700 hover:bg-indigo-100 text-xs font-bold">+ Mitglied</button>
              </div>
              <div class="space-y-2">
                ${state.members.map(m => `
                  <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200/70 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                      <span class="w-9 h-9 rounded-xl flex items-center justify-center text-lg" style="background:${m.color}25">${esc(m.avatar)}</span>
                      <div>
                        <p class="font-bold text-sm text-slate-900">${esc(m.name)}</p>
                        <p class="text-xs text-slate-500">${m.roleType === 'parent' ? 'Elternteil' : 'Kind'}</p>
                      </div>
                    </div>
                    <button onclick="deleteMember('${m.id}')" class="p-2 rounded-lg text-slate-400 hover:text-rose-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                  </div>
                `).join('')}
              </div>
            </section>

            <!-- 5. Sicherheit, PINs & Familienname -->
            <section class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200/80 shadow-sm space-y-4">
              <h3 class="font-bold text-slate-900 flex items-center gap-2"><i data-lucide="lock" class="w-5 h-5 text-indigo-600"></i> PIN-Schutz & Allgemein</h3>
              <div class="space-y-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">Familienname</label>
                  <input id="adm-fam-name" value="${esc(state.familyName)}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Admin-PIN (4 Ziffern)</label>
                    <input id="adm-pin-admin" maxlength="4" pattern="\\d{4}" value="${esc(state.pins.admin)}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-mono tracking-widest">
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Eltern-PIN (4 Ziffern)</label>
                    <input id="adm-pin-parent" maxlength="4" pattern="\\d{4}" value="${esc(state.pins.parent)}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-mono tracking-widest">
                  </div>
                </div>
                <div class="flex flex-wrap items-center justify-between gap-2 pt-2">
                  <button onclick="saveSecuritySettings()" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition min-h-[42px]">Speichern</button>
                  <button onclick="resetAllData()" class="px-3.5 py-2.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold transition min-h-[42px]">Beispieldaten zurücksetzen</button>
                </div>
              </div>
            </section>
          </div>
        </div>
      `;
    }

    function saveSyncSettings() {
      state.sync.oneDriveClientId = document.getElementById('adm-od-client').value.trim();
      state.sync.oneDrivePath = document.getElementById('adm-od-path').value.trim() || '/FamilienHub/daten.json';
      state.sync.autoSync = document.getElementById('adm-od-auto').checked;
      saveState(false);
      showToast('OneDrive-Einstellungen gespeichert', 'success');
    }

    function savePushSettings(silent = false) {
      state.push.ntfyTopic = document.getElementById('adm-ntfy-topic').value.trim();
      state.push.notifyOnTask = document.getElementById('adm-push-task').checked;
      state.push.notifyOnShopping = document.getElementById('adm-push-shop').checked;
      state.push.notifyOnEvent = document.getElementById('adm-push-ev').checked;
      saveState();
      if (!silent) showToast('Push-Einstellungen gespeichert', 'success');
    }

    function saveGoogleCalSettings() {
      state.calendar.googleEmbedUrl = document.getElementById('adm-gcal-embed').value.trim();
      state.calendar.googleIcsUrl = document.getElementById('adm-gcal-ics').value.trim();
      saveState();
      showToast('Google-Kalender-URLs gespeichert', 'success');
    }

    function saveSecuritySettings() {
      const aPin = document.getElementById('adm-pin-admin').value.trim();
      const pPin = document.getElementById('adm-pin-parent').value.trim();
      if (!/^\d{4}$/.test(aPin) || !/^\d{4}$/.test(pPin)) {
        showToast('PINs müssen genau 4 Ziffern enthalten.', 'error');
        return;
      }
      state.familyName = document.getElementById('adm-fam-name').value.trim() || 'Unsere Familie';
      state.pins.admin = aPin;
      state.pins.parent = pPin;
      saveState();
      renderApp();
      showToast('Sicherheit & Familienname gespeichert', 'success');
    }

    function openMemberModal() {
      openModal('Neues Familienmitglied', `
        <form onsubmit="saveMemberForm(event)" class="space-y-3.5">
          <div class="grid grid-cols-4 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Avatar</label>
              <input id="mb-avatar" value="🧒" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-center text-lg">
            </div>
            <div class="col-span-3">
              <label class="block text-xs font-semibold text-slate-600 mb-1">Name *</label>
              <input id="mb-name" required placeholder="z.B. Lena" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Typ</label>
              <select id="mb-type" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm bg-white">
                <option value="child">Kind</option>
                <option value="parent">Elternteil</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Farbe</label>
              <input id="mb-color" type="color" value="#f59e0b" class="w-full h-[42px] px-1 py-1 rounded-xl border border-slate-200 bg-white">
            </div>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-semibold text-sm">Abbrechen</button>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-semibold text-sm">Hinzufügen</button>
          </div>
        </form>
      `);
    }

    function saveMemberForm(e) {
      e.preventDefault();
      const name = document.getElementById('mb-name').value.trim();
      state.members.push({
        id: uid('m'),
        name,
        short: name.split(' ')[0],
        roleType: document.getElementById('mb-type').value,
        color: document.getElementById('mb-color').value,
        avatar: document.getElementById('mb-avatar').value.trim() || '👤',
        stars: 0
      });
      saveState();
      closeModal();
      renderApp();
      showToast(`${name} hinzugefügt`, 'success');
    }

    function deleteMember(id) {
      if (state.members.length <= 1) {
        showToast('Mindestens ein Familienmitglied muss bestehen bleiben.', 'warning');
        return;
      }
      openConfirmModal('Mitglied entfernen', 'Dieses Familienmitglied wirklich entfernen?', () => {
        state.members = state.members.filter(m => m.id !== id);
        saveState();
        renderApp();
      });
    }

    function resetAllData() {
      openConfirmModal('Alles zurücksetzen', 'Alle eigenen Änderungen werden gelöscht und die Beispieldaten wiederhergestellt.', () => {
        state = structuredClone(DEFAULT_STATE);
        saveState(false);
        renderApp();
        showToast('Beispieldaten wiederhergestellt', 'info');
      });
    }

    // =========================================================================
    // 18. INITIALISIERUNG BEIM START
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      // Automatische Prüfung fälliger Verbrauchsartikel beim Start
      const autoAdded = syncDueConsumptionItems(true);
      renderApp();
      checkSleepMode();
      if (autoAdded > 0 && canEdit()) {
        showToast(`${autoAdded} fällige(r) Verbrauchsartikel automatisch auf die Einkaufsliste gesetzt.`, 'info');
      }
      // Uhr & Schlafmodus alle 15 Sekunden aktualisieren
      setInterval(checkSleepMode, 15000);
    });
  </script>
</body>
</html>
